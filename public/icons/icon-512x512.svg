<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glowing Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.6"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.4"/>

  <!-- Center Core Pulsing Dot -->
  <circle cx="256" cy="256" r="28" fill="#ef4444"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- 360 Text Badge -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="4">360</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="6">RADIO &amp; TV</text>
</svg>
